[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "enfinia-service-runtime"
version = "0.6.0"
description = "Shared runtime boundaries for Enfinia Python services"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42,<47",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "starlette>=0.37,<1",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/enfinia_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
