name: Python runtime

on:
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/python-runtime.yml"
  push:
    branches:
      - main
    paths:
      - "python/**"
      - ".github/workflows/python-runtime.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: python -m pip install --disable-pip-version-check -e "python[dev]"
      - run: pytest -q python/tests
      - run: mypy python/src python/tests
      - run: python -m compileall -q python/src python/tests
