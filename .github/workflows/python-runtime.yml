name: Python runtime

on:
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/python-runtime.yml"
  push:
    branches:
      - main
    paths:
      - "python/**"
      - ".github/workflows/python-runtime.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: python -m pip install --disable-pip-version-check -e "python[dev]"
      - name: Test
        working-directory: python
        run: pytest -q
      - name: Typecheck
        working-directory: python
        run: mypy src tests
      - name: Compile
        working-directory: python
        run: python -m compileall -q src tests
